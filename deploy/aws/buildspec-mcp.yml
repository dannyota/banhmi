version: 0.2

# CodeBuild spec for the banhmi MCP read-path image (ARM64 Graviton, privileged
# docker on an ARM_CONTAINER fleet). Build deps come from the private
# banhmi-build-cache bucket, served to the docker build through a localhost HTTP
# server (the bucket allows no public access; --network host lets the build
# stages reach it). Debian/golang base images pull through the ECR pull-through
# cache; distroless comes from gcr.io directly (no auth or rate limits).

env:
  shell: bash

phases:
  pre_build:
    commands:
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=${ACCOUNT}.dkr.ecr.ap-southeast-1.amazonaws.com
      - aws ecr get-login-password --region ap-southeast-1
          | docker login --username AWS --password-stdin ${REGISTRY}
      - aws s3 cp --recursive --no-progress s3://banhmi-build-cache/deps /tmp/depsrv/deps
  build:
    commands:
      - GO_IMAGE=${REGISTRY}/ecr-public/docker/library/golang:1.26-bookworm
      - DEBIAN_IMAGE=${REGISTRY}/ecr-public/docker/library/debian:bookworm-slim
      - "TAG=$(echo \"${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse HEAD 2>/dev/null || echo manual)}\" | cut -c1-12)"
      # <semver>-<YYYYMMDD> per CLAUDE.md; falls back when the clone has no tags.
      - VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)-$(date +%Y%m%d)"
      # Serve the private deps to the build stages from a docker container on the
      # host network (daemon-owned — CodeBuild reaps shell-backgrounded processes,
      # so a plain `python3 ... &` dies between/within commands).
      - docker run -d --name depsrv --network host -v /tmp/depsrv:/srv:ro
          ${REGISTRY}/ecr-public/docker/library/python:3-slim
          python3 -m http.server 8788 --directory /srv
      - for i in $(seq 1 15); do curl -sf -o /dev/null http://localhost:8788/deps/qwen3-embedding/tokenizer.json && break; sleep 2; done
      - curl -sf -o /dev/null http://localhost:8788/deps/qwen3-embedding/tokenizer.json && echo "dep server up"
# v0.4.0 split: slim MCP image (no model) + embedder image. The embedder pushes
      # into the banhmi-mcp repo under embedder-* tags (the codebuild role's ECR push
      # is scoped to the banhmi-mcp/banhmi-pipeline repos). The last pre-split
      # in-process image stays pinned as banhmi-mcp:f3910556224b for rollback.
      - docker build
          -f deploy/containerfiles/Containerfile.ecs.server
          --build-arg VERSION=${VERSION}
          --build-arg GO_IMAGE=${GO_IMAGE}
          -t ${REGISTRY}/banhmi-mcp:latest
          -t ${REGISTRY}/banhmi-mcp:${TAG}
          .
      - docker build
          -f deploy/containerfiles/Containerfile.ecs.embedder
          --network host
          --build-arg CACHE_BASE=http://localhost:8788/deps
          --build-arg GO_IMAGE=${GO_IMAGE}
          --build-arg DEBIAN_FETCH_IMAGE=${DEBIAN_IMAGE}
          -t ${REGISTRY}/banhmi-mcp:embedder-latest
          -t ${REGISTRY}/banhmi-mcp:embedder-${TAG}
          .
  post_build:
    commands:
      - docker push ${REGISTRY}/banhmi-mcp:latest
      - docker push ${REGISTRY}/banhmi-mcp:${TAG}
      - docker push ${REGISTRY}/banhmi-mcp:embedder-latest
      - docker push ${REGISTRY}/banhmi-mcp:embedder-${TAG}
