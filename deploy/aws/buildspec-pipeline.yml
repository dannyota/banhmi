version: 0.2

# CodeBuild spec for the banhmi pipeline image (x86_64, privileged docker).
# Base images are pulled through the ECR pull-through cache (ecr-public prefix)
# so builds never touch Docker Hub or require Docker Hub credentials.

env:
  shell: bash

phases:
  pre_build:
    commands:
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=${ACCOUNT}.dkr.ecr.ap-southeast-1.amazonaws.com
      - aws ecr get-login-password --region ap-southeast-1
          | docker login --username AWS --password-stdin ${REGISTRY}
  build:
    commands:
      - GO_IMAGE=${REGISTRY}/ecr-public/docker/library/golang:1.26-bookworm
      - DEBIAN_IMAGE=${REGISTRY}/ecr-public/docker/library/debian:bookworm-slim
      - "TAG=$(echo \"${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse HEAD 2>/dev/null || echo manual)}\" | cut -c1-12)"
      - docker build
          -f deploy/containerfiles/Containerfile
          --build-arg GO_IMAGE=${GO_IMAGE}
          --build-arg DEBIAN_IMAGE=${DEBIAN_IMAGE}
          -t ${REGISTRY}/banhmi-pipeline:latest
          -t ${REGISTRY}/banhmi-pipeline:${TAG}
          .
  post_build:
    commands:
      - docker push ${REGISTRY}/banhmi-pipeline:latest
      - docker push ${REGISTRY}/banhmi-pipeline:${TAG}
