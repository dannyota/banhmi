name: Corpus source generation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: corpus-source-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate and verify corpus persistence source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve trusted migration history
        run: bash tools/ci/prepare_migration_validation.sh

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: "1.31.1"

      - name: Test corpus generation guards
        run: python3 -m unittest discover -s tools/ci -p 'test_*generation.py'

      - name: Generate migration-backed corpus sqlc output
        run: bash tools/ci/generate_corpus.sh

      - name: Verify clean replay, upgrade replay, and schema behavior
        run: bash tools/ci/verify_corpus_generation.sh

      - name: Record generated drift
        run: bash tools/ci/check_corpus_generation.sh --report-only

      - name: Stage allowlisted review artifact
        env:
          CORPUS_GENERATION_OUTPUT: ${{ runner.temp }}/corpus-source
        run: bash tools/ci/stage_corpus_generation.sh "$CORPUS_GENERATION_OUTPUT"

      - name: Upload reviewable corpus source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-source-${{ github.sha }}
          path: ${{ runner.temp }}/corpus-source/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Reject generated drift
        run: bash tools/ci/check_corpus_generation.sh

      - name: Record generation scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Corpus source generation scope

          - Required through reusable checks and independently dispatchable. All databases are disposable with synthetic inputs.
          - Freezes trusted SQL blobs and inherited PR history for auth, extensions, and all corpus layers.
          - Builds the actual trusted-base migrator, inserts legacy rows, and verifies rows, sequences, and ledgers after upgrade.
          - Compares clean and upgraded catalogs and transition canonical SQL reconstructed only from the trusted base when available.
          - Reapplies candidate SQL and verifies catalog, data, and ledger idempotence.
          - Runs the committing race test and rollback suites on separate migrated databases, rejecting missing tests and nested skips.
          - Uploads only corpus generated Go and verification provenance before rejecting drift. It never writes SQL or checksums.
          SUMMARY
