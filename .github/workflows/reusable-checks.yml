name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check maintained documentation
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 tools/ci/check_repository_hygiene.py

  auth-generation:
    name: Auth source generation and drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres_canonical:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: auth_schema_validation
          POSTGRES_USER: banhmi_auth_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banhmi_auth_owner -d auth_schema_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_migrated:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: auth_migration_validation
          POSTGRES_USER: banhmi_auth_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U banhmi_auth_owner -d auth_migration_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: auth_schema_validation
      PGUSER: banhmi_auth_owner
      PGPASSWORD: ci-owner-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: "1.31.1"

      - name: Set up Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: "v1.3.0"

      - name: Generate auth sources
        run: bash tools/ci/generate_auth.sh

      - name: Apply generated auth migration chain
        env:
          BANHMI_AUTH_MIGRATION_DATABASE_URL: postgres://banhmi_auth_owner:ci-owner-password@localhost:5433/auth_migration_validation?sslmode=disable
        run: go run ./cmd/auth-migrate

      - name: Compare canonical and migrated auth schemas
        env:
          CANONICAL_POSTGRES_CONTAINER_ID: ${{ job.services.postgres_canonical.id }}
          MIGRATED_POSTGRES_CONTAINER_ID: ${{ job.services.postgres_migrated.id }}
        run: bash tools/ci/verify_auth_schema_parity.sh

      - name: Stage allowlisted generation output
        env:
          AUTH_GENERATION_OUTPUT: ${{ runner.temp }}/auth-generation
        run: bash tools/ci/stage_auth_generation.sh "$AUTH_GENERATION_OUTPUT"

      - name: Upload reviewable generation output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-generation-${{ github.sha }}
          path: ${{ runner.temp }}/auth-generation/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Reject generated drift
        run: bash tools/ci/check_auth_generation.sh

      - name: Record generation scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Auth generation scope

          - Runs sqlc only for the auth entry in `sqlc.yaml`, formats Go sources, resolves `go.mod` and `go.sum`, and maintains the Atlas checksum.
          - Validates the full canonical schema in disposable PostgreSQL before the first pass creates `20261011000000_init.sql` from its exact bytes. A committed migration is append-only and is never overwritten.
          - Applies the migration chain to an independent PostgreSQL service and compares matching-version schema dumps, capability-role attributes, and memberships.
          - The artifact contains only auth sqlc output, auth migration files, dependency files, and a formatting patch. The workflow has no source write permission.
          - Atlas OSS does not inspect PostgreSQL functions, roles, or grants. The initial migration preserves the canonical SQL directly; the PostgreSQL job verifies its behavior.
          SUMMARY

  go:
    name: Default Go build, vet, and short tests
    needs: auth-generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build default packages
        run: timeout 10m go build ./...

      - name: Vet default packages
        run: timeout 10m go vet ./...

      - name: Run short tests
        run: timeout 10m go test -short ./...

      - name: Record verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Default Go verification scope

          - Uses the exact Go version declared by `go.mod` with `CGO_ENABLED=1` for bundled go-fitz support.
          - Runs `go build ./...`, `go vet ./...`, and `go test -short ./...` without live-source, service, database, corpus, ONNX, or evaluation inputs.
          - Short mode skips tests guarded by `testing.Short()`.
          - A successful job proves the default source builds, vets, and passes short tests. It does not prove corpus quality, database integration, tagged ONNX builds, or release readiness.
          SUMMARY

  browser:
    name: Website browser integration
    needs: auth-generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BANHMI_BROWSER_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require runner Chrome
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [[ -z "$chrome_path" || ! -x "$chrome_path" ]]; then
            printf 'google-chrome is required for browser integration tests\n' >&2
            exit 1
          fi
          "$chrome_path" --version

      - name: Run website browser tests
        run: timeout 10m go test -count=1 -run TestBrowser ./pkg/web

      - name: Record browser verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Website browser verification scope

          - Requires Chrome already installed on the hosted runner and uses the repository's pinned chromedp module. No frontend package manager or browser download runs.
          - Runs only `TestBrowser*` in `pkg/web` with `BANHMI_BROWSER_TESTS=1` against fake authentication and evidence served by `httptest`.
          - A successful job proves the tested browser interactions and visible evidence warnings. It does not contact a deployed site, production service, or cloud account.
          SUMMARY

  auth-postgres:
    name: Auth PostgreSQL integration
    needs: auth-generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: banhmi_auth_test
          POSTGRES_USER: banhmi_auth_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banhmi_auth_owner -d banhmi_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BANHMI_AUTH_TEST_DATABASE_URL: postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/banhmi_auth_test?sslmode=disable
      BANHMI_AUTH_MIGRATION_DATABASE_URL: postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/banhmi_auth_test?sslmode=disable
      BANHMI_AUTH_DATABASE_URL: postgres://banhmi_auth_app:ci-runtime-password@localhost:5432/banhmi_auth_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create synthetic deployment logins
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql \
            --host localhost \
            --username banhmi_auth_owner \
            --dbname banhmi_auth_test \
            --set ON_ERROR_STOP=1 \
            <<'SQL'
          CREATE ROLE banhmi_auth_app LOGIN PASSWORD 'ci-runtime-password';
          CREATE ROLE banhmi_auth_ops LOGIN PASSWORD 'ci-operator-password';
          SQL

      - name: Apply auth migrations
        run: go run ./cmd/auth-migrate

      - name: Reject incomplete role bootstrap inputs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: banhmi_auth_test
          PGUSER: banhmi_auth_owner
          PGPASSWORD: ci-owner-password
        run: bash tools/ci/check_auth_bootstrap.sh

      - name: Bootstrap synthetic deployment roles
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql \
            --host localhost \
            --username banhmi_auth_owner \
            --dbname banhmi_auth_test \
            --set ON_ERROR_STOP=1 \
            --set runtime_login_role=banhmi_auth_app \
            --set operator_login_role=banhmi_auth_ops \
            --file deploy/authmigrations/bootstrap/grant_roles.sql

      - name: Run auth PostgreSQL tests
        run: |
          packages=(./pkg/identity ./cmd/auth-migrate ./cmd/auth-cleanup)
          if [[ -d pkg/oauthserver ]]; then
            packages+=(./pkg/oauthserver)
          fi
          go test -count=1 "${packages[@]}"

      - name: Record database verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Auth PostgreSQL verification scope

          - Applies only `deploy/authmigrations` to a disposable PostgreSQL 17 service with synthetic credentials.
          - Uses distinct migration, runtime, and test database URLs. No repository or production credential is available to the job.
          - Proves each missing bootstrap role variable fails before either deployment login receives a capability role, then exercises the complete bootstrap path.
          - Runs identity, auth migration, auth cleanup, and, when present, OAuth server packages without `-short` so their integration tests can use PostgreSQL.
          SUMMARY
