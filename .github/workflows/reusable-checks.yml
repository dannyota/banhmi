name: Reusable checks

on:
  workflow_call:
    secrets:
      SEMGREP_APP_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan fetched history for secrets
        run: python3 tools/ci/security_scan.py gitleaks

  semgrep-sast:
    name: semgrep-sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Semgrep Code with the OSS engine
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: python3 tools/ci/security_scan.py semgrep-sast

  semgrep-sca:
    name: semgrep-sca
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Semgrep Supply Chain with the OSS engine
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: python3 tools/ci/security_scan.py semgrep-sca

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check maintained documentation
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 tools/ci/check_repository_hygiene.py

      - name: Install checksum-verified workflow lint tools
        run: bash tools/ci/install_lint_tools.sh

      - name: Check workflow expressions and inline shell
        run: actionlint

      - name: Check CI shell scripts
        run: shellcheck tools/ci/*.sh

  generation:
    name: Migration replay and source generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check trusted migration history
        run: python3 tools/ci/check_migration_history.py

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: "1.31.1"

      - name: Clean every sqlc output directory
        run: python3 tools/ci/sqlc_outputs.py clean

      - name: Generate every sqlc entry
        run: sqlc generate

      - name: Stage regenerated regular files
        id: generated-artifact
        run: |
          artifact_path="${RUNNER_TEMP}/generation-artifact"
          python3 tools/ci/sqlc_outputs.py stage --destination "${artifact_path}"
          printf 'path=%s\n' "${artifact_path}" >> "$GITHUB_OUTPUT"

      - name: Upload reviewable generated trees
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generation-${{ github.sha }}
          path: ${{ steps.generated-artifact.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Reject generated drift
        run: bash tools/ci/reject_generation_drift.sh

      - name: Provision fresh corpus databases and roles as administrator
        run: bash tools/ci/run_corpus_chain_tests.sh provision

      - name: Replay every migration chain on fresh databases
        run: bash tools/ci/replay_generation.sh

      - name: Run retained corpus schema tests on independent databases
        run: bash tools/ci/run_schema_tests.sh

      - name: Run fresh corpus chain and guard tests
        env:
          BANHMI_CORPUS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tools/ci/run_corpus_chain_tests.sh

      - name: Reject repository changes during replay and tests
        if: ${{ always() }}
        run: bash tools/ci/reject_generation_drift.sh --repository

      - name: Record generation scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Generation scope

          - Compares complete frozen legacy subtrees and existing auth files against master and the final event base; auth additions follow inherited versions.
          - Provisions writer, release, and control databases, extensions, and capability bindings as the disposable administrator; replays their chains as separate non-superuser migration logins, alongside legacy and auth replay.
          - Cleans every configured sqlc Go output directory, generates every entry from migration files, uploads only regenerated regular files, and rejects tracked, untracked, ignored, or dependency drift before provisioning, replay, or tests.
          - Runs fresh chain replay and guard tests on isolated databases against drift-free committed code. Runs all six retained corpus schema tests on independent race and rollback databases, then requires the immutable-evidence test to fail without skips on omitted-function and omitted-trigger copies.
          - Always checks for tracked repository changes and untracked non-ignored files after replay and tests; ignored caches are allowed. Changes restored before this check are not detected.
          - Uses synthetic inputs; this job does not prove real-document quality or deployed behavior.
          SUMMARY

  ci:
    name: Required checks aggregate
    needs: [hygiene, generation, go, browser, auth-postgres, gitleaks, semgrep-sast, semgrep-sca]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report required child results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: hygiene generation go browser auth-postgres gitleaks semgrep-sast semgrep-sca
        run: python3 tools/ci/check_results.py

  go:
    name: Default Go build, vet, and short tests
    needs: generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build default packages
        run: timeout 10m go build ./...

      - name: Vet default packages
        run: timeout 10m go vet ./...

      - name: Run short tests
        run: timeout 10m go test -short ./...

      - name: Record verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Default Go verification scope

          - Uses the exact Go version declared by `go.mod` with `CGO_ENABLED=1` for bundled go-fitz support.
          - Runs `go build ./...`, `go vet ./...`, and `go test -short ./...` without live-source, service, database, corpus, ONNX, or evaluation inputs.
          - Short mode skips tests guarded by `testing.Short()`.
          - A successful job proves the default source builds, vets, and passes short tests. It does not prove corpus quality, database integration, tagged ONNX builds, or release readiness.
          SUMMARY

  browser:
    name: Website browser integration
    needs: generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BANHMI_BROWSER_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require runner Chrome
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [[ -z "$chrome_path" || ! -x "$chrome_path" ]]; then
            printf 'google-chrome is required for browser integration tests\n' >&2
            exit 1
          fi
          "$chrome_path" --version

      - name: Run website browser tests
        run: timeout 10m go test -count=1 -run TestBrowser ./pkg/web

      - name: Record browser verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Website browser verification scope

          - Requires Chrome already installed on the hosted runner and uses the repository's pinned chromedp module. No frontend package manager or browser download runs.
          - Runs only `TestBrowser*` in `pkg/web` with `BANHMI_BROWSER_TESTS=1` against fake authentication and evidence served by `httptest`.
          - A successful job proves the tested browser interactions and visible evidence warnings. It does not contact a deployed site, production service, or cloud account.
          SUMMARY

  auth-postgres:
    name: Auth PostgreSQL integration
    needs: generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: banhmi_auth_test
          POSTGRES_USER: banhmi_auth_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banhmi_auth_owner -d banhmi_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BANHMI_AUTH_TEST_DATABASE_URL: postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/banhmi_auth_test?sslmode=disable
      BANHMI_AUTH_MIGRATION_DATABASE_URL: postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/banhmi_auth_test?sslmode=disable
      BANHMI_AUTH_DATABASE_URL: postgres://banhmi_auth_app:ci-runtime-password@localhost:5432/banhmi_auth_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create synthetic deployment logins
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql \
            --host localhost \
            --username banhmi_auth_owner \
            --dbname banhmi_auth_test \
            --set ON_ERROR_STOP=1 \
            <<'SQL'
          CREATE ROLE banhmi_auth_app LOGIN PASSWORD 'ci-runtime-password';
          CREATE ROLE banhmi_auth_ops LOGIN PASSWORD 'ci-operator-password';
          SQL

      - name: Apply auth migrations
        run: go run ./cmd/auth-migrate

      - name: Reject incomplete role bootstrap inputs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: banhmi_auth_test
          PGUSER: banhmi_auth_owner
          PGPASSWORD: ci-owner-password
        run: bash tools/ci/check_auth_bootstrap.sh

      - name: Bootstrap synthetic deployment roles
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql \
            --host localhost \
            --username banhmi_auth_owner \
            --dbname banhmi_auth_test \
            --set ON_ERROR_STOP=1 \
            --set runtime_login_role=banhmi_auth_app \
            --set operator_login_role=banhmi_auth_ops \
            --file deploy/authmigrations/bootstrap/grant_roles.sql

      - name: Provision isolated auth databases
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: banhmi_auth_owner
          PGPASSWORD: ci-owner-password
        run: |
          set -euo pipefail
          for database in banhmi_auth_login_race banhmi_auth_block_race \
            banhmi_auth_code_race banhmi_auth_refresh_race banhmi_auth_consent_race \
            banhmi_auth_cleanup; do
            createdb "${database}"
            BANHMI_AUTH_MIGRATION_DATABASE_URL="postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/${database}?sslmode=disable" \
              go run ./cmd/auth-migrate
            psql --dbname "${database}" --set ON_ERROR_STOP=1 \
              --set runtime_login_role=banhmi_auth_app \
              --set operator_login_role=banhmi_auth_ops \
              --file deploy/authmigrations/bootstrap/grant_roles.sql
          done

      - name: Run auth PostgreSQL tests with JSON capture
        run: |
          set -euo pipefail
          events="${RUNNER_TEMP}/auth-tests.jsonl"
          # Exclude only the races run below. All other current and future tests run.
          identity_races='^TestPostgresStoreIntegration$/(^concurrent_login_consumption_has_one_winner$|^block_timestamp_follows_the_account_lock$)'
          oauth_races='^TestOAuthPostgresConcurrent(AuthorizationCodeReplay|RefreshReplay|ConsentApprovalAndDenial)$'
          go test -json -count=1 -p=1 -skip "${identity_races}" \
            ./pkg/identity ./cmd/auth-migrate | tee "${events}"
          go test -json -count=1 -skip "${oauth_races}" ./pkg/oauthserver | tee -a "${events}"
          run_isolated() {
            local database="$1" package="$2" selection="$3"
            BANHMI_AUTH_TEST_DATABASE_URL="postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/${database}?sslmode=disable" \
            BANHMI_AUTH_MIGRATION_DATABASE_URL="postgres://banhmi_auth_owner:ci-owner-password@localhost:5432/${database}?sslmode=disable" \
            BANHMI_AUTH_DATABASE_URL="postgres://banhmi_auth_app:ci-runtime-password@localhost:5432/${database}?sslmode=disable" \
              go test -json -count=1 -run "${selection}" "${package}" | tee -a "${events}"
          }
          run_isolated banhmi_auth_login_race ./pkg/identity \
            '^TestPostgresStoreIntegration$/^concurrent_login_consumption_has_one_winner$'
          run_isolated banhmi_auth_block_race ./pkg/identity \
            '^TestPostgresStoreIntegration$/^block_timestamp_follows_the_account_lock$'
          run_isolated banhmi_auth_code_race ./pkg/oauthserver \
            '^TestOAuthPostgresConcurrentAuthorizationCodeReplay$'
          run_isolated banhmi_auth_refresh_race ./pkg/oauthserver \
            '^TestOAuthPostgresConcurrentRefreshReplay$'
          run_isolated banhmi_auth_consent_race ./pkg/oauthserver \
            '^TestOAuthPostgresConcurrentConsentApprovalAndDenial$'
          run_isolated banhmi_auth_cleanup ./cmd/auth-cleanup '.'

      - name: Require auth and OAuth tests without skips
        if: ${{ always() }}
        run: python3 tools/ci/check_auth_tests.py "${RUNNER_TEMP}/auth-tests.jsonl"

      - name: Record database verification scope
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Auth PostgreSQL verification scope

          - Applies only `deploy/authmigrations` to a disposable PostgreSQL 17 service with synthetic credentials.
          - Uses distinct migration, runtime, and test database URLs. No repository or production credential is available to the job.
          - Proves each missing bootstrap role variable fails before either deployment login receives a capability role, then exercises the complete bootstrap path.
          - Runs identity, auth migration, auth cleanup, and mandatory OAuth server packages without `-short`, with JSON capture and uncached tests.
          - Isolates each identity and OAuth database race and cleanup on separately migrated and bootstrapped databases; ordinary packages run serially.
          - Requires the checked-in auth test list, complete package captures, and zero skipped or failed tests, including subtests. Only the migration package may report `[no test files]`.
          SUMMARY
