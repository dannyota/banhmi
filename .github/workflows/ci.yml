name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Reusable checks
    uses: ./.github/workflows/reusable-checks.yml
    permissions:
      contents: read

  ci:
    name: CI
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report aggregate result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: checks
        run: python3 tools/ci/check_results.py
