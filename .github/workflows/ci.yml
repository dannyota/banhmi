name: Temporary Semgrep inventory capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-capture:
    name: Capture review metadata, not a SAST gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out capture tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false

      - name: Check out exact scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 503a938cd473a8fa12d99b790aa6217daa917aa0
          path: target
          persist-credentials: false

      - name: Capture validated location metadata
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SEMGREP_APP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'dependabot[bot]' && secrets.SEMGREP_APP_TOKEN || '' }}
        run: python3 probe/tools/ci/semgrep_inventory_capture.py

      - name: Upload only validated inventory metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-inventory-metadata-503a938cd473a8fa12d99b790aa6217daa917aa0
          path: ${{ runner.temp }}/semgrep-inventory-output/inventory.json
          if-no-files-found: error
          retention-days: 1
