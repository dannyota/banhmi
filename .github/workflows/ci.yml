name: Temporary security negative probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-negative:
    name: Real Gitleaks negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated Gitleaks detection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/ci/security_negative_probe.py
