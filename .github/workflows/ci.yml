name: Temporary SAST transition controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-controls:
    name: Real pinned SAST transition controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out temporary probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false

      - name: Check out exact reviewed helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 969b64ece768478aebc21c60a01c1ddaad5fb412
          path: target
          persist-credentials: false

      - name: Prove exact acceptance and regression rejection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SEMGREP_APP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'dependabot[bot]' && secrets.SEMGREP_APP_TOKEN || '' }}
        run: python3 probe/tools/ci/semgrep_transition_probe.py
