# sqlc reads schema history from embedded Goose migration chains and queries
# from sql/. One generated package per layer under pkg/store/. pgx/v5 driver,
# native Go types with pointers for nullable columns, json.RawMessage for JSONB,
# and pgvector.Vector for the embedding column. Generate on GitHub after edits.
version: "2"
sql:
  - name: corpus_intake
    engine: postgresql
    schema: deploy/corpusmigrations/writer
    queries: internal/corpus/store/intake/queries
    gen:
      go:
        package: intakedb
        out: internal/corpus/store/intake/intakedb
        sql_package: pgx/v5
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: vector
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
              pointer: true
          - db_type: sparsevec
            go_type:
              type: string
          - db_type: sparsevec
            nullable: true
            go_type:
              type: string
              pointer: true

  - name: corpus_document
    engine: postgresql
    schema: deploy/corpusmigrations/writer
    queries: internal/corpus/store/document/queries
    gen:
      go:
        package: documentdb
        out: internal/corpus/store/document/documentdb
        sql_package: pgx/v5
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: vector
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
              pointer: true
          - db_type: sparsevec
            go_type:
              type: string
          - db_type: sparsevec
            nullable: true
            go_type:
              type: string
              pointer: true

  - engine: "postgresql"
    schema: "deploy/authmigrations/*.sql"
    queries: "sql/auth/queries"
    gen:
      go:
        package: "dbauth"
        sql_package: "pgx/v5"
        out: "pkg/store/auth"
        emit_interface: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true

  - engine: "postgresql"
    schema: "deploy/migrations/bronze"
    queries: "sql/bronze/queries.sql"
    gen:
      go:
        package: "dbbronze"
        sql_package: "pgx/v5"
        out: "pkg/store/bronze"
        emit_interface: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true

  - engine: "postgresql"
    schema: "deploy/migrations/silver"
    queries: "sql/silver/queries.sql"
    gen:
      go:
        package: "dbsilver"
        sql_package: "pgx/v5"
        out: "pkg/store/silver"
        emit_interface: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true

  - engine: "postgresql"
    schema: "deploy/migrations/gold"
    queries: "sql/gold/queries.sql"
    gen:
      go:
        package: "dbgold"
        sql_package: "pgx/v5"
        out: "pkg/store/gold"
        emit_interface: true
        overrides:
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
          # content_sparse (BM25) is queried via raw pgx, never sqlc, so map the
          # sparsevec type to a plain string so sqlc's model generation succeeds.
          - db_type: "sparsevec"
            go_type:
              type: "string"
          - db_type: "sparsevec"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true

  - engine: "postgresql"
    schema: "deploy/migrations/ingest"
    queries: "sql/ingest/queries.sql"
    gen:
      go:
        package: "dbingest"
        sql_package: "pgx/v5"
        out: "pkg/store/ingest"
        emit_interface: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true

  - engine: "postgresql"
    schema: "deploy/migrations/config"
    queries: "sql/config/queries.sql"
    gen:
      go:
        package: "dbconfig"
        sql_package: "pgx/v5"
        out: "pkg/store/config"
        emit_interface: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
